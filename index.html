<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Murdoku — Tabuleiros</title>
  <link rel="stylesheet" href="css/layout.css" />
</head>
<body>
  <main class="conteudo-principal">
    <header class="hub-cabecalho">
      <div class="filtros" aria-label="Filtrar tabuleiros por dificuldade">
        <button class="filtro-btn filtro-btn--ativo" type="button" data-filtro="todos">Todos</button>
        <button class="filtro-btn" type="button" data-filtro="facil">Fácil</button>
        <button class="filtro-btn" type="button" data-filtro="medio">Médio</button>
        <button class="filtro-btn" type="button" data-filtro="dificil">Difícil</button>
      </div>
    </header>

    <section id="grade-tabuleiros" class="grade-tabuleiros" aria-label="Tabuleiros disponíveis"></section>
  </main>

  <script src="js/boards.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/home.js"></script>
  <script>
    montarNav("tabuleiros");
    montarHubTabuleiros();
  </script>
</body>
</html>
