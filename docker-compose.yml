services:
  back-murdoku:
    build:
      context: ./server
    container_name: back-murdoku
    restart: unless-stopped
    ports:
      - "7032:7032"
    environment:
      PORT_BACK: 7032
    volumes:
      - ./server:/usr/src/app
      - /usr/src/app/node_modules
    command: npm start

volumes:
  postgres_data: